# Universe 25 abundant arm. Biology/drives = phase-2l calibration to Calhoun landmarks: the 2i optimum
# (ramp 0.2, nursing disturbance 4 / 0.2, courtship erosion 0.04) with a per-individual lifespan
# (max_age_days 850, max_age_sd_days 100, chosen by a 1600-d scan on N@1444 / N@1588 and a 12-seed
# rebound check; see NOTES.md 'Phase 2l' and configs/calibrated_calhoun.yaml). 2026-11-03, seed 7000,
# 6 ticks/day. Decisions are held for 1/6 day at finer ticks_per_day.
seed: 7000
ticks_per_day: 6  # reference resolution (ticks_per_day_ref); loop is dt-invariant, 12/24 give the same arc
max_agents: 4096
