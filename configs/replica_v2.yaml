# Universe 25 replica v2 (docs/REPLICA_V2.md). Milestone M1: Calhoun's pen - 16 triangular
# cells, four tunnels of four box levels per cell, wall hoppers (food for 9500) and water
# platforms (water for 6144), box feeding until the December 1968 reconfiguration (day ~160),
# no playground. Milestone M2 (a priori, not fitted): founders 48 days old, no calendar
# conception gate, litter 5.5, territories (one owner per cell, who sires). The rest of the
# biology is still the frozen 2m point of configs/default.yaml (uncalibrated for this pen);
# later milestones change it here, never in default.yaml.
# Universe 25 abundant arm. Biology/drives = phase-2m calibration to Calhoun landmarks: the 2i optimum
# (ramp 0.2, nursing disturbance 4 / 0.2, courtship erosion 0.04) + colony-wide developmental exposure
# (imprint_breakdown_exposure 1.0: young lose competence wherever they are once the colony is in breakdown,
# so the collapse cannot rebound) + per-individual lifespan 780 +- 150 d (1600-d scans on N@1444 / N@1588,
# 12-seed checks; see NOTES.md 'Phase 2m' and configs/calibrated_calhoun.yaml). 2026-11-03, seed 7000,
# 6 ticks/day. Decisions are held for 1/6 day at finer ticks_per_day.
seed: 7000
ticks_per_day: 6  # reference resolution (ticks_per_day_ref); loop is dt-invariant, 12/24 give the same arc
max_agents: 4096
initial_pairs: 4
days: 1600.0
device: auto
backend: auto
log_every_ticks: 6
snapshot_every_days: 50
arm_label: TRACK-E-U25-REPLICA-V2
