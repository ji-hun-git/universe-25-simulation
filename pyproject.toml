[project]
name = "universe25"
version = "0.1.0"
description = "Research-grade Universe 25 simulation with playground (Track E, no play reward)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jason" }]
dependencies = [
  "numpy>=2,<3",  # trajectories depend on the NumPy major version (review 2026-11-09)
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["warp-lang>=1.0", "torch>=2.0"]
dev = []

[project.scripts]
universe25 = "universe25.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
