[project]
name = "universe25"
version = "0.2.0"
description = "Agent-based simulation of Universe 25, Calhoun's mouse utopia (1968-1973), fitted to the historical record"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["universe 25", "mouse utopia", "behavioral sink", "calhoun", "agent-based model",
            "population dynamics", "population collapse", "animal behavior", "simulation"]
authors = [{ name = "Jason" }]
dependencies = [
  "numpy>=2,<3",  # trajectories depend on the NumPy major version (review 2026-11-09)
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/ji-hun-git/universe-25-simulation"
Documentation = "https://github.com/ji-hun-git/universe-25-simulation/blob/master/docs/USER_GUIDE.md"

[project.optional-dependencies]
gpu = ["warp-lang>=1.0", "torch>=2.0"]
dev = []

[project.scripts]
universe25 = "universe25.__main__:main"
universe25-app = "universe25.app:main"  # the viewer and live runs (README, "App")

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
